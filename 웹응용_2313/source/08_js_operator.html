<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // 1. 할당연산자 (산술 - 이항)
      let x = 1;
      let y = 3;
      x = x + y;
      console.log(y); // 3
      console.log(x); // 4
      x = x - y;
      console.log(x); //1
      x = x * y;
      console.log(x); // 3
      x = x / y;
      console.log(x); // 1
      x = 2;
      y = 3;
      x = x % y;
      console.log(x); // 2
      x = x ** y;
      console.log(x); // 8

      // 2. 복합할당연산자
      x = 3;
      y = 5;
      console.log((x += y)); // x = x+y, 8
      console.log((x -= y)); // x = x-y, 3
      console.log((x *= y)); // x = x*y, 15
      console.log((x /= y)); // x = x/y, 3
      console.log((x %= y)); // x = x%y, 3

      // 3. 비교연산자 : == ===, !=, !==
      let a = 3;
      let b = "3";
      console.log(a == b); // true > 값만 비교
      console.log(a === b); // false > 갑과 타입 다 비교

      // 4. 산술연산자 : 단항 ++(증가), --(감소), +(숫자화), -(단항부정)
      x = 5;
      y = 6;
      y = x++;
      console.log(x); //
      console.log(y); //

      y = x--;
      console.log(x); //
      console.log(y); //

      // 5. 단항부정 연산자 : 부호를 바꿔준다.
      x = -3;
      console.log(x); // -3
      console.log(-x); // 3

      // 6. 숫자화 연산자
      let z = true;
      console.log(+z); // 1

      x = +"3";
      y = +"5";
      console.log(x + y);

      // 활용 : prompt로 두 수를 입력 받아 합을 구하는 코드 작성
      // 효율성, 가독성, 결과 확인... 후 부르기
      //   let num1 = +prompt("첫번째 수 입력: ");
      //   let num2 = +prompt("두번째 수 입력: ");
      //   console.log("두 수의 합: ", num1 + num2);

      // 7. 논리 연산자 : 여러가지 조건을 만족시키는지 알아보는 연산자. &&(and : 둘 다 참 => true) / || (or : 둘 중 하나만 참 => true)
      let o = true && false;
      o = 3 > 2 && 4 > 7; // false
      console.log(o);
      o = 3 > 2 && 8 > 7; // true
      console.log(o);

      o = true || false;
      o = o = 3 > 2 || 4 > 7; // true
      console.log(o);
      o = 3 > 2 || 4 < 2 || 2 > 1; // ture
      console.log(o);

      // 8. 문자열 연산자 : + (concate)
      let firstName = "John";
      let lastName = "Bacon";
      let fullName = firstName + " " + lastName;
      console.log(fullName);

      // 9. 조건 삼항 연산자
      // let 변수 = 조건 ? 참 : 거짓
      let age = 16;
      let isAdult = age >= 20 ? "성인" : "미성년자";
      console.log(isAdult);

      // 활용 : 90점이상이면 "A" 80점이상이면 "B" 70점이상이면 "C" 60점이상이면 "D" 나머지는 "E"
      // 점수 입력 : prompt
      let score = +prompt("점수를 입력하시오> ");
      let grade =
        score >= 90
          ? "A"
          : score >= 80
            ? "B"
            : score >= 70
              ? "C"
              : score >= 60
                ? "D"
                : "E";
      console.log("학점은 " + grade + "입니다.");
    </script>
  </body>
</html>
