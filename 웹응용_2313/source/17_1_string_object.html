<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // 4. slice() 실무 활용 예제
      // 4-1. 긴 문자열을 일부만 질라서 보여주고 나머지는 "..." 처리 시
      const longString =
        "지난 11일부터 이틀간 이어진 삼성전자 노사 협상 사후조정이 최종 결렬된 가운데, 삼성전자가 “매우 유감스럽다”는 입장을 발표했다.";

      const truncateTitle = (title, maxLength) => {
        if (title.length > maxLength) {
          return title.slice(0, maxLength) + "...";
        } else {
          return title;
        }
      };
      console.log(truncateTitle(longString, 15)); // 지난 11일부터 이틀간 이어...

      // 4-2. 마스킹 : 개인 정보를 안 보이게 처리
      let phoneNumber = "010-1234-5678";
      let hiddenNumber = phoneNumber.slice(0, -4) + "****";
      console.log(hiddenNumber); // 010-1234-****

      phoneNumber = "010-345-6789";
      hiddenNumber = phoneNumber.slice(0, -4) + "****";
      console.log(hiddenNumber); // 010-345-****

      // 7. replace() 실무 활용 예제 (with. 정규식(regular experession))
      /* 정규식(regular experession) : 특정한 포멧을 만들어 내는 식
      - /  / 사이에 작성
      - D : 숫자
      - \ : not
      - 옵션 :
        g => 모두(all)
        i => 대소문자를 구분하지 않는다.
      */
      // 회원가입 시 전번 010-1111-2222 형식으로 입력 => db에 저장 시 01011112222
      phoneNumber = "010-1234-5678";
      while (phoneNumber.indexOf("-") !== -1) {
        phoneNumber = phoneNumber.replace("-", "");
      }
      console.log(phoneNumber); // 01012345678

      phoneNumber = "010-1234-5678";
      let clearNumber = phoneNumber.replace(/\D/g, "");
      console.log(clearNumber); // 01012345678

      let str = "Welcome Jeju! jeju";
      console.log(str.replace(/Jeju/gi, "Seoul")); // Welcome Seoul! Seoul

      // 12. *****padStart() 실무 활용 예제
      // 앞자리 마스킹, 카드 번호를 DB에서 읽어와 뒷자리 4자리만 보여주고자 할 경우
      const cardNumber = "7654";
      const maskCardNumber = cardNumber.padStart(16, "*");
      console.log(maskCardNumber); // ************7654

      // 14. charAt 실무 활용 예제
      // 주민등록 번호 뒷자리의 첫글자를 이용해 성별을 확인
      // 090313-4012613 1,3 (내국인 남성) / 2,4 (내국인 여성) / 5,7 (외국인 남자) / 6,8 (외국인 여성)
      // 14. charAt 실무 활용 예제
      // 주민등록 번호 뒷자리의 첫글자를 이용해 성별을 확인
      // 1,3 (내국인 남성) / 2,4 (내국인 여성)
      // 5,7 (외국인 남성) / 6,8 (외국인 여성)

      const checkGender = (sn) => {
        const gender = sn.charAt(7);

        if (gender === "1" || gender === "3") {
          return "내국인 남성";
        } else if (gender === "2" || gender === "4") {
          return "내국인 여성";
        } else if (gender === "5" || gender === "7") {
          return "외국인 남성";
        } else if (gender === "6" || gender === "8") {
          return "외국인 여성";
        } else {
          return "알 수 없음";
        }
        return gender;
      };

      console.log(checkGender("091015-3056465")); // 내국인 남성
      console.log(checkGender("091125-4058465")); // 내국인 여성

      // 16. split() 실무 활용 예제
      const url = "https://myshop.com/products/electronics/iphone15";
      const pageSegment = url.split("/");
      // console.log(pageSegment);
      let size = pageSegment.length;
      console.log(`카테고리 : ${pageSegment[size - 2]}`); // 카테고리 : electronics
      console.log(`제품명 : ${pageSegment[size - 1]}`); // 제품명 : iphone15

      // **************************** 로그 파일 내용 가져오기 ****************************
      // 접근 허용이 안 되는 사용자의 로그 기록 찾기
      const csvData =
        "2026-04-20,Login_Success,user_01\n2024-04-29,Login_Fail,user_02";
      const logData = csvData.split("\n");

      for (const line of logData) {
        const [date, status, user] = line.split(",");

        if (status === "Login_Fail") {
          console.log(`접근 실패 사용자: ${user}`); // 접근 실패 사용자: user_02
        }
      }

      // 18. endWith() 실무 활용 예제
      // 파일 업로드 시 jpg, png만 가능
      const fileNameCheck = (fileName) => {
        const lowerName = fileName.toLowerCase();
        return lowerName.endsWith(".jpg") || lowerName.endsWith(".png");
      };

      console.log(fileNameCheck("AAA.JPG")); // 업로드 가능
      console.log(fileNameCheck("bbb.gif")); // 업로드 불가능
    </script>
  </body>
</html>
