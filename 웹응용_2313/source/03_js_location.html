<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      /* 변수의 종류
        1. var
            - ES6 이전부터 사용
            - 재선언 가능, 재할당 가능                
            - 전역 변수 : 프로그램 전체에 영향을 미치는 변수
             => 덮어쓰기가 가능, 협업시 비추
     */

      var name = "2학년 3반";
      console.log(name);

      var name = "2학년 4반"; // 재선언, 덮어쓰기
      console.log(name);

      var x = 5;
      var y = 7;
      var z = x + y;
      console.log("z : ", z);
      x = 9; // 재할당
      z = x - y; // 재할당
      console.log("z : ", z);

      /*
        2. let
            - ES6 이후 등장
            - 재선언 블가능 => 권장
            - 재할당 가능
        */

      let x1 = 10;
      let y1 = 7;
      let z1 = x1 + y1;
      console.log("z1: ", z1);

      // let x1 = 9; 재선언 불가능
      // // Uncaught SyntaxError: Identifier 'x1' has already been declared (at 03_js_variable_declaration.html:44:11)

      x1 = 9; // 재할당 가능
      y1 = 11;
      z1 = x1 - y1;
      console.log("z1 :", z1);

      /*
        3. const
            - ES6 이후 등장
            - 재선언, 재할당 모두 불가능
            - 상수 선언에 활용
        */

      const PI = 3.14;
      PI = 3; // 실행은 되나, 예외 처리.
    </script>
  </body>
</html>
