<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // 나이에 따른 버스 요금 계산 => 가독성, 효율성
      /* 6세 이하 : 무료
        12세 미만 : 450
        18세 미만 : 700
        18세 이상 : 1000
        70세 이상 : 무료(노인) */
      // 빈칸 처리 (자바스럽지 않게!!!!)

      let age = +prompt("나이 입력> ");
      let money = 0;

      if (age) {
        if (age <= 6 || age >= 70) {
          money = "무료";
        } else if (age < 12) {
          money = 450;
        } else if (age < 18) {
          money = 700;
        } else {
          money = 1000;
        }
      }
      console.log("버스 요금: " + money);

      let x = 3;
      if (!x) {
        console.log("if 실행");
      } else {
        console.log("else 실행");
      }
    </script>
  </body>
</html>
