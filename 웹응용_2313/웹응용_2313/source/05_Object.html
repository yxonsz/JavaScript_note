<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      /* 객체 (Object)
            - 관련있는 데이터를 하나로 담을 수 있는 객체
            - 파이썬의 딕셔너리와 유사
            - {} 로 감싼다.
            - { 키(key) : 값(value) } 으로 표현
            - 파이썬과의 차이점
                - 키에는 문자열만 올 수 있다. 유일해야함!! (파이썬은 숫자만)
                - 값에는 거의 모든 데이터 타입 가능(문자열, 숫자, 배열, 객체 boolean... )
            - 객체는 순서를 보장하지 않는다. => ES6 이후 보장!! (파이썬 딕셔너리도 마찮가지)
        */

      let student = {
        name: "공은성",
        age: 17,
        phone: "010-1111-2222",
        address: "서울시 관악구",
        number: 2301,
        hobby: ["게임", "잠자기", "헬스"],
      };
      console.log(student);

      let person = {
        111: "111",
        222: "222",
      };
      console.log(person);

      // 1. 객체의 키값을 가져오기
      let keys = Object.keys(person); // 배열 리턴
      console.log(keys);
      console.log(keys[0] + keys[1]);

      // 2. 객체의 값을 가져오기 => .
      let name = student.name;
      console.log(name);

      // 3. 객체의 값을 변경하기 => 키로 불러서 할당
      student.age = 27;
      console.log(student);

      // 4. 객체의 키, 값을 추가하기 => add 이런거 필요 X!!
      student.gender = "남성";
      console.log(student);
    </script>
  </body>
</html>
