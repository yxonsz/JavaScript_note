<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>미림 카페 주문 관리</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "맑은 고딕", sans-serif;
        background-color: #f8f4ef;
        padding: 30px;
      }

      h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #5d4037;
      }

      section {
        background: white;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      h2 {
        margin-bottom: 15px;
        color: #6d4c41;
      }

      label {
        margin-right: 10px;
        font-weight: bold;
      }

      select,
      input {
        padding: 8px;
        margin-right: 10px;
      }

      button {
        padding: 8px 15px;
        background: #795548;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover {
        background: #5d4037;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: center;
      }

      th {
        background: #a1887f;
        color: white;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 10px;
      }

      #totalQuantity,
      #totalPrice {
        margin-top: 10px;
        font-size: 18px;
        font-weight: bold;
      }

      #searchResult {
        margin-top: 15px;
      }
    </style>
  </head>

  <body>
    <h1>☕ 미림 카페 주문 관리</h1>

    <section>
      <h2>메뉴 선택</h2>

      <label for="menuSelect">메뉴</label>
      <select id="menuSelect"></select>

      <label for="quantityInput">수량</label>
      <input type="number" id="quantityInput" value="1" min="1" />

      <button onclick="addOrder()">주문 추가</button>
    </section>

    <section>
      <h2>메뉴 검색</h2>

      <input type="text" id="searchInput" placeholder="메뉴명을 입력하세요" />
      <button onclick="searchMenu()">검색</button>

      <div id="searchResult">검색 결과가 여기에 표시됩니다.</div>
    </section>

    <section>
      <h2>주문 내역</h2>

      <table>
        <thead>
          <tr>
            <th>주문번호</th>
            <th>메뉴명</th>
            <th>단가</th>
            <th>수량</th>
            <th>금액</th>
          </tr>
        </thead>

        <tbody id="orderTableBody">
          <tr>
            <td colspan="5">주문 내역이 없습니다.</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section>
      <h2>결제 정보</h2>

      <div id="totalQuantity">총 주문 수량 : 0개</div>
      <div id="totalPrice">총 결제 금액 : 0원</div>
    </section>

    <script>
      const menuList = [
        { name: "아메리카노", price: 3000, category: "coffee" },
        { name: "카페라떼", price: 4000, category: "coffee" },
        { name: "바닐라라떼", price: 4500, category: "coffee" },
        { name: "초코라떼", price: 4200, category: "nonCoffee" },
        { name: "레몬에이드", price: 5000, category: "ade" },
        { name: "자몽에이드", price: 5200, category: "ade" },
      ];

      const orderList = [];

      const loadMenu = () => {
        const menuSelect = document.getElementById("menuSelect");

        let optionList = [];

        for (let i = 0; i < menuList.length; i++) {
          optionList.push(
            `<option value="${i}">
                ${menuList[i].name} (${menuList[i].price}원)
            </option>`,
          );
        }

        menuSelect.innerHTML = optionList.join("");
      };

      const addOrder = () => {
        const menuIndex = document.getElementById("menuSelect").value;
        const quantity = Number(document.getElementById("quantityInput").value);

        if (quantity < 1) {
          alert("수량은 1개 이상 입력하세요.");
          return;
        }

        const menu = menuList[menuIndex];

        const order = {
          orderNo: "ORDER-" + (orderList.length + 1),
          name: menu.name,
          price: menu.price,
          quantity: quantity,
          total: menu.price * quantity,
        };

        orderList.push(order);

        renderOrderTable();
      };

      const renderOrderTable = () => {
        const tbody = document.getElementById("orderTableBody");

        if (orderList.length === 0) {
          tbody.innerHTML =
            "<tr>" + "<td colspan='5'>주문 내역이 없습니다.</td>" + "</tr>";
          return;
        }

        let html = "";

        for (let i = 0; i < orderList.length; i++) {
          html += "<tr>";
          html += "<td>" + orderList[i].orderNo + "</td>";
          html += "<td>" + orderList[i].name + "</td>";
          html += "<td>" + orderList[i].price + "</td>";
          html += "<td>" + orderList[i].quantity + "</td>";
          html += "<td>" + orderList[i].total + "</td>";
          html += "</tr>";
        }

        tbody.innerHTML = html;
      };

      const searchMenu = () => {
        const keyword = document.getElementById("searchInput").value;

        let html = "";
        let found = false;

        for (let i = 0; i < menuList.length; i++) {
          if (menuList[i].name.includes(keyword)) {
            html += "<p>";
            html += menuList[i].name + " (" + menuList[i].price + "원)";
            html += "</p>";

            found = true;
          }
        }

        if (!found) {
          html = "검색 결과가 없습니다.";
        }

        document.getElementById("searchResult").innerHTML = html;
      };

      loadMenu();
    </script>
  </body>
</html>
