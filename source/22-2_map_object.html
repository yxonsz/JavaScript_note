<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      /* 개발자는 왜 일반 객체 대신 Map을 쓰는가?
        1. 객수 구하기 쉬움
        2. 자료를 추가하고 삭제하는 속도가 빠름
        3. key에 무엇이든 올 수 있음 */

      /* 실무 예제 : 온라인 쇼핑몰 장바구니 관리
            쇼핑몰 웹사이트를 만들 때 장바구니는 아래 기능이 반드시 필요
        1. 상품 담기 (추가)
        2. 이미 담긴 상품인지 확인하고 수량 늘리기 (조회 및 수정)
        3. 상품 뺴기 (삭제)
        4. 장바구니에 퐁 몇 종류의 상품이 있는지 확인 (개수 파악) */

      const myCart = new Map();

      // 이미 장바구니에 들어있는 제픔 목록
      myCart.set("product_01", { name: "핸드폰", price: 1800000, quantity: 1 });
      myCart.set("product_12", { name: "노트북", price: 3000000, quantity: 1 });
      myCart.set("product_100", { name: "하리보", price: 2000, quantity: 5 });

      // 추가로 구매할 상품
      let userInput = "product_12";

      // 장바구니에 있는지 확인하고 실행 => myCartCheckAndDo() 함수
      /* 있다면 => 정말 추가할래? => yes => quantity ++
                                  no => X
         없다면 => console.log("추가하였습니다.") */

      const myCartCheckAndDo = (productId) => {
        if (myCart.has(productId)) {
          let answer = prompt(
            "이미 장바구니에 있습니다. 추가하시겠습니까? (yes / no)",
          );

          if (answer === "yes") {
            myCart.get(productId).quantity++;

            console.log(
              `현재 장바구니에 담긴 ${myCart.get(productId).name}의 갯수 : ${myCart.get(productId).quantity}`,
            );
          } else if (answer === "no") {
            console.log("취소하였습니다.");
          } else {
            console.log("yes 또는 no를 입력해주세요.");
          }
        } else {
          console.log("추가하였습니다.");
        }
      };

      myCartCheckAndDo(userInput);
      myCartCheckAndDo(userInput);
      myCartCheckAndDo(userInput);
      myCartCheckAndDo(userInput);

      /* showmyCart() 함수 => 과제
      - 장바구니 내역 보여주기 */
      const showmyCart = () => {
        console.log("===== 장바구니 내역 =====");

        myCart.forEach((product) => {
          console.log(
            `상품명 : ${product.name}, 가격 : ${product.price}원, 수량 : ${product.quantity}개`,
          );
        });
      };

      let totalQuantity = 0;

      myCart.forEach((product) => {
        totalQuantity += product.quantity;
      });

      showmyCart();
    </script>
  </body>
</html>
