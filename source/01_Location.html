<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>자바스크립트의 작성 위치</title>
    <script>
      window.document.write("Hello World-1");
      // 자바의 System.out.println 과 같은 문장!
    </script>
  </head>
  <body>
    <!-- 자바스크립의 작성 위치
        1. <head> ==> 3등
        2. <body> ==> 2등
        3. 외부 파일 삽입 ==> 1등!! 가장 추천
        4. 태그사이 (인라인) ==> 4등.. 비추...
        -->
    <p>Hello World -2</p>
    <p>졸지마!!!!!!!!!!!!!!!!!</p>

    <script>
      document.write("Hello World-3");
    </script>
    <br />
    <script src="./js/01_js_location.js" defer></script>

    <button>전송</button>
  </body>
</html>
