    <script>
      // 다음은 좋아하는 음식을 단답형으로 입력하는 설문조사
      // 사용자가 입력한 음식 종류를 저장한 배열 foods

      let foods = [
        "치킨",
        "햄버거",
        "순대국",
        "제육",
        "초밥",
        "돈까스",
        "순대국",
      ];

      // 1. 배열에서 동일한 요소제거 (객체)
      let newFoods = [];

      for (let i = 0; i < foods.length; i++) {
        let isDuplicate = false;

        for (let j = 0; j < newFoods.length; j++) {
          if (foods[i] === newFoods[j]) {
            isDuplicate = true;
            break;
          }
        }

        if (!isDuplicate) {
          newFoods.push(foods[i]);
        }
      }

      console.log(newFoods);

      // 2. 배열에서 동일한 요소제거 : 배열의 filter 이용
