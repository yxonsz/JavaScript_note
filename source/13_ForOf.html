<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let brands = ["애플", "구글", "아마존", "마이크로소프트", "메타"];

      // 1. 배열에서 사용하는 경우
      for (const brand of brands) {
        console.log(brand);
      }

      // 2. 문자열에서 사용하는 경우
      const lang = "JavaScript";
      for (const char of lang) {
        console.log(char);
      }

      // 숫지를 한 글자씩
      let num = 901231623547;
      for (const digit of String(num)) {
        console.log(digit);
      }
    </script>
  </body>
</html>
