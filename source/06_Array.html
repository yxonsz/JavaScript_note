<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      /* 배열
            - 하나 이상의 데이터를 담을 수 있다.
            - 데이터에는 순서가 존재한다. -> 순서 = 인덱스
            - index : 0부터
            - []
            - 어떤 데이터도 올 수 있다.
            - 어떤 데이터도 함께* 올 수 있다.
            - 생성하는 순간 속성(property) 중 length이 자동으로 생성
        */
      let nums = [1, 2, 3, 4, 5];
      let str = ["a", "b", "c"];
      let mix = [3, 5.6, false, [3, 4, 5], { name: "공은성" }];

      console.log(nums);
      console.log(str);
      console.log(mix);

      console.log(nums.length);
      console.log(str.length);
      console.log(mix.length);

      let a = [];
      console.log(a);
      console.log(a.length);

      // 1. 배열 요소의 수정 - 덮어씌우기
      nums[4] = 6;
      console.log(nums);

      // 2. 배열의 내장 함수 (pop(맨 마지막에 있는 것 꺼내기 / 매개변수 X), push(맨 뒤에 넣기))
      // *매개변수(parameter) = 함수를 설명하기 위해 전달하는 값*
      console.log(mix.pop());
      console.log(mix);
      console.log(mix.pop());
      console.log(mix);
      console.log(mix.pop());
      console.log(mix);
      console.log(mix.pop());
      console.log(mix);
      mix.push(4.5);
      console.log(mix);
      mix.push({ name: "공은성" });
      console.log(mix);
      mix.push(["a", "b"]);
      console.log(mix);

      //3. 배열의 특정 요소를 수정
      mix[2] = 100;
      console.log(mix);
      mix[2] = null;
      delete mix[2];
      console.log(mix);

      /* 4. 활용
        - object와 함께 사용
        - 예를 들어 우리가 개발한 웹사이트에서
        사용자 목록을 가져와 처리한다고 가정하자
      */
      // let userList = [{}, {}, {}]; 선언만 하고 할당 X
      let userList = [
        {
          name: "정국",
          gender: "남자",
          email: "jung@gamil.com",
          phone: "000-1111-222",
        },
        {
          name: "뷔",
          gender: "남자",
          email: "vui@gamil.com",
          phone: "000-2222-1111",
        },
        {
          name: "로제",
          gender: "여자",
          email: "rose@gmail.com",
          phone: "000-3333-1111",
        },
      ];

      console.log(userList[2].phone);
      let List = prompt("누구의 전화번호를 알고 싶나요? (ex. 0, 1, 2)");
      console.log(userList[List].phone);
    </script>
</html>
