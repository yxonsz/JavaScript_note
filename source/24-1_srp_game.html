<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>가위바위보</title>
  </head>
  <body>
    <button onclick="game('가위')">가위</button>
    <button onclick="game('바위')">바위</button>
    <button onclick="game('보')">보</button>

    <script src="./js/common.js"></script>

    <script>
      /*
        getRandomInteger 을 사용해서 컴퓨터와 가위, 바위, 보를 하는 게임

        조건 1. 반드시 common의 getRandomInteger 사용
        조건 2. 다양한 object를 사용
      */

      const srp = {
        1: "가위",
        2: "바위",
        3: "보",
      };

      function game(user) {
        const number = getRandomInteger(1, 3);
        const computer = srp[number];

        console.log("컴퓨터: " + computer);
        console.log("사용자: " + user);

        if (user === computer) {
          console.log("비겼습니당 😑");
        }

        if (
          (user === "가위" && computer === "보") ||
          (user === "바위" && computer === "가위") ||
          (user === "보" && computer === "바위")
        ) {
          console.log("Win!! 😊");
        }

        if (
          (user === "가위" && computer === "바위") ||
          (user === "바위" && computer === "보") ||
          (user === "보" && computer === "가위")
        ) {
          console.log("Lose.. 😭");
        }
      }
    </script>
  </body>
</html>
